<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>

    <link rel="icon" type="image/x-icon" href="./img/Favicon.png" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />

    <script src="./models/keyboard.class.js"></script>
    <script src="./js/game.js"></script>
    <script src="./models/soundHub.class.js"></script>

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>

    <script src="./models/status-bar.class.js"></script>
    <script src="./models/status-bar-health.class.js"></script>
    <script src="./models/status-bar-coin.class.js"></script>
    <script src="./models/status-bar-bottle.class.js"></script>
    <script src="./models/status-bar-endboss.class.js"></script>

    <script src="./models/collectable-object.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/coin.class.js"></script>

    <script src="./models/character.class.js"></script>
    <script src="./models/basic-enemy.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/chicken-small.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>

    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./models/world.class.js"></script>
  </head>

  <body onload="SoundHub.getFromLocalStorage()">
    <div class="rotate_overlay">
      <img
        class="rotate_overlay_img"
        src="./img/rotate_phone.png"
        alt="Bitte drehe Dein Handy"
      />
    </div>

    <h1>El Pollo Loco</h1>

    <div class="game_screen">
      <div class="game_wrapper">
        <!-- Soundbar  -->
        <div class="soundbar">
<button id="sound_toggle" onclick="SoundHub.toggleSound()" tabindex="-1">
  <img id="sound_icon" src="./img/icons/sound_off.png" alt="sound" />

</button>

        </div>

        <!-- Startscreen  -->
        <div id="start_screen" class="start_screen">
          <img
            class="start_screen_img"
            src="./img/9_intro_outro_screens/start/startscreen_3.png"
            alt="Startscreen"
          />

          <button class="button start_game" onclick="startGame()">
            Start Game
          </button>

          <div class="endscreen_links startscreen_links">
            <!-- endscreen-links-Klasse? -->
            <a href="./impressum.html" class="button">Impressum</a>
            <button class="button" onclick="openControls()">Controls</button>
          </div>
        </div>

        <div
          id="controls_overlay"
          class="controls_overlay d_none"
          onclick="closeControls()"
        >
          <div class="controls_card" onclick="stopClick(event)">
            <h2>Controls</h2>
            <button
              class="controls_close"
              onclick="closeControls()"
              aria-label="close"
            >
              ✕
            </button>

            <ul class="controls_list">
              <li><b>Move: </b>← / →</li>
              <li><b>Jump: </b>Space</li>
              <li><b>Throw: </b>D</li>
            </ul>
          </div>
        </div>

        <!-- Canvas  -->
        <canvas id="canvas" width="720" height="480"> </canvas>

        <!-- Endscreen  -->
        <div id="endscreen" class="endscreen d_none">
          <img id="endscreen_img" src="" alt="Endscreen You won" />
          <button
            class="button start_game endscreen_restart"
            onclick="restartGame()"
          >
            Play again
          </button>

          <div class="endscreen_links">
            <a href="./impressum.html" class="button">Impressum</a>
            <a href="./credits.html" class="button">Credits</a>
          </div>
        </div>

        <!-- Mobile Controls  -->
        <div class="controls_mobile">
          <div class="controls_mobile_left">
            <button class="button_mobile" id="button_left">
              <img src="./img/icons/left_mobile.png" alt="move left" />
            </button>

            <button class="button_mobile" id="button_right">
              <img src="./img/icons/right_mobile.png" alt="move right" />
            </button>
          </div>

          <div class="controls_mobile_right">
            <button class="button_mobile" id="button_jump">
              <img src="./img/icons/jump_mobile.png" alt="jump" />
            </button>

            <button class="button_mobile" id="button_throw">
              <img src="./img/icons/bottle_mobile.png" alt="throw" />
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
